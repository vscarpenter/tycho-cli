[package]
name = "tycho-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Privacy-first usage analytics for Claude Code's local JSONL transcripts"
license = "MIT"
repository = "https://github.com/vscarpenter/tycho-cli"
homepage = "https://github.com/vscarpenter/tycho-cli"

# The installed binary is `tycho`; the package name differs so a crates.io
# collision on the bare name can never block publishing. Renaming the binary
# is this line plus `BIN_NAME` in src/lib.rs.
[[bin]]
name = "tycho"
path = "src/main.rs"

[lib]
name = "tycho"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
csv = "1"
iana-time-zone = "0.1"
ratatui = "0.29"
rayon = "1"
rust_decimal = { version = "1", features = ["serde-float"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

# Malformed input is normal input for this tool: panicking accessors are
# banned in library and binary code (clippy.toml relaxes this inside tests).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
