# --- Alibaba Cloud Model Studio (Qwen) ---------------------------------------
#
# International (Singapore) pay-as-you-go rates, verified 2026-09-06 against
# https://www.alibabacloud.com/help/en/model-studio/qwen3-8-max and
# https://www.alibabacloud.com/help/en/model-studio/qwen3-8-flash. The
# Chinese-mainland endpoint is priced separately. cache_read is the
# implicit-cache rate, which is what an OpenAI-compatible usage block
# reports as cached tokens; explicit cache reads bill a different figure
# ($0.17 on max, $0.016 on flash), and explicit cache creation is what both
# write buckets carry. Snapshot ids (qwen3.8-max-0902, qwen3.8-max-2026-09-02)
# resolve onto the base stanza through the '-' boundary. Qwen3.8-Flash-Next
# is the open-weight preview of this architecture; its hosted form is
# qwen3.8-flash. Local pulls (qwen3.8:27b) never reach these stanzas — ':'
# is not a '-' boundary.

[models."qwen3.8-max"]
