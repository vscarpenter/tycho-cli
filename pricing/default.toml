# --- Google Gemini API -------------------------------------------------------
#
# Verified 2026-09-06 against https://ai.google.dev/gemini-api/docs/pricing
# (paid tier). $0.75/$3.75 is introductory pricing for both Flash models
# through 2026-12-31; from 2027-01-01 Google's published rate is $1.50/$7.50
# with cache reads at $0.15 — revisit then. Output covers thinking tokens.
# Google bills explicit-cache creation at the standard input rate plus a
# per-hour storage fee tycho cannot see, so both write buckets equal input.
#
# gemini-3.8-flash-cyber is available only through Google's Fairwind
# Program and has no published rate. It is zero-rated here on purpose:
# without its own stanza the '-' boundary would bill it at Flash rates,
# and [shadow] below points doctor's estimate at gemini-3.8-flash instead.

[models."gemini-3.8-flash"]
