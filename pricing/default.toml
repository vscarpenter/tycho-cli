# Reference rates for `tycho doctor`'s shadow estimate. Keys are zero-rated
# or unpriced model ids; values name a priced model whose rates stand in for
# them. Resolved by the same longest-prefix, '-' boundary rule as [models],
# so "gpt-5.1-codex-max" inherits the "gpt-5.1-codex" entry.
#
# gpt-5.4 is chosen as the same-generation label that carries public rates.
#
# codex-unknown is deliberately absent: its defining property is that the
# model is unknown, so no reference rate is justifiable. It contributes its
# tokens to "Unpriced tokens" and nothing to the dollar estimate.
[shadow]
"gpt-5-codex" = "gpt-5.4"
"gpt-5.1-codex" = "gpt-5.4"
"gpt-5.2-codex" = "gpt-5.4"
# Restricted-program variant with no public rate; its base model is the
# closest published figure.
"gemini-3.8-flash-cyber" = "gemini-3.8-flash"
