# tycho default pricing — USD per million tokens.
#
# Source: Anthropic model pricing reference (cached 2026-06-24), verified
# 2026-07-04 against https://platform.claude.com/docs/en/pricing.
# Cache rates derive from Anthropic's published multipliers on the input
# rate: 5-minute cache write = 1.25x, 1-hour cache write = 2x, cache
# read = 0.1x.
#
# claude-sonnet-5 uses the introductory rate ($2/$10) billed through
# 2026-08-31; the standard rate is $3 input / $15 output. Override any
# model at ~/.config/tycho/pricing.toml or with --pricing <PATH>.
#
# Model lookup is longest-prefix: "claude-opus-4-8-20270101" matches
# "claude-opus-4-8"; a hypothetical "claude-opus-4" entry would only catch
# ids no longer entry matches.
#
# OpenAI rates were verified 2026-07-08 against
# https://developers.openai.com/api/docs/pricing. They use Standard API rates.
# For models with separate short/long-context rows, these defaults use the
# short-context row; override them if your logs should be billed at long-context,
# Batch, Flex, Priority, data-residency, or subscription-plan rates. OpenAI
# prompt caching has no separate write charge, so cache_write_* matches input
# and cached input is represented as cache_read.
#
# Some Codex session logs contain historical/private model labels that do not
# appear on the current public API rate card. Those are explicitly zero-rated
# below to avoid noisy warnings; override them if you have account-specific
# credit or API pricing for those labels. Local Ollama-style model ids are also
# zero-rated by prefix.

