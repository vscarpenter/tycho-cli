# tycho default pricing — USD per million tokens.
#
# Source: Anthropic model pricing reference, verified 2026-09-06 against
# https://platform.claude.com/docs/en/about-claude/pricing.
# Cache rates derive from Anthropic's published multipliers on the input
# rate: 5-minute cache write = 1.25x, 1-hour cache write = 2x, cache
# read = 0.1x — except claude-fable-5-1 and claude-mythos-5-1, which
# Anthropic bills at 0.025x for cache reads ($0.25). Those two need their
# own stanzas: the '-' boundary rule would otherwise resolve
# claude-fable-5-1 onto claude-fable-5 and charge $1 per million on the
# bucket that dominates agentic sessions.
#
# claude-sonnet-5 is $2/$10. That began as an introductory rate billed
# through 2026-08-31, and earlier revisions of this file said to raise it
# to $3/$15 afterward — do NOT. Anthropic made the $2/$10 rate permanent
# on 2026-08-11 and cancelled the increase. Override any model at
# ~/.config/tycho/pricing.toml or with --pricing <PATH>.
#
# Fast mode on claude-opus-5 bills at $10/$50 rather than the standard
# $5/$25, but the logs record the same model id either way — override
# claude-opus-5 if your usage is predominantly fast mode.
#
# Model lookup requires a '-' boundary after a prefix key ("gpt-5.4" matches
# "gpt-5.4-mini" ids but never "gpt-5.41"). Same-family variants with their
# own rates (e.g. a future gpt-5.5-codex) still need explicit entries —
# a bare "gpt-5.5" entry would otherwise price them at API rates.
#
# OpenAI rates were verified 2026-09-06 against
# https://developers.openai.com/api/docs/pricing. They use Standard API rates.
# For models with separate short/long-context rows, these defaults use the
# short-context row (gpt-6-astra and the gpt-5.6 family bill 2x input and
# 1.5x output for the whole request once a prompt passes 272K tokens);
# override them if your logs should be billed at long-context, Batch, Flex,
# Fast mode, data-residency, or subscription-plan rates. The flagship rate
# card prints a cache-write column at 1.25x input, and those stanzas carry
# it in both write buckets; the older rows (gpt-5.5 and earlier, codex,
# chat-latest) publish no write charge, so cache_write_* matches input
# there. Cached input is represented as cache_read either way. Codex
# rollouts record no cache-write token count at all, so the write rate only
# reaches a total through Pi's transcripts.
#
# gpt-5.6-sol's $4/$20 is promotional pricing OpenAI guarantees at least
# through 2026-11-21; the family was $5/$30, $2.5/$15 and $1/$6 when this
# file was verified in July. gpt-5.6-cyber is a Daybreak-program model with
# a published rate, so it is priced. gpt-daybreak-blue-latest and
# gpt-daybreak-red-latest are aliases that currently point at gpt-5.6-sol
# and gpt-5.6-cyber; OpenAI moves them as Daybreak models ship, so their
# stanzas track the pointee, not the alias.
#
# Some Codex session logs contain historical/private model labels that do not
# appear on the current public API rate card. Those are explicitly zero-rated
# below to avoid noisy warnings; override them if you have account-specific
# credit or API pricing for those labels. Local Ollama-style model ids
# (name:tag) carry no entry at all — `doctor` lists them separately as
# "Local models" instead of warning about them.
#
# The [shadow] section at the end of this file maps those zero-rated labels
# to a reference model whose rates stand in for them. It feeds `tycho doctor`'s
# shadow estimate ONLY — it never changes a reported cost. Override or extend
# it exactly like [models].

[models."claude-fable-5-1"]
input = 10.0
output = 50.0
cache_write_5m = 12.5
cache_write_1h = 20.0
cache_read = 0.25

