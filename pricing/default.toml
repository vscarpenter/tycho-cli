# --- Ollama Cloud -----------------------------------------------------------
#
# Ollama Cloud is metered per token, so these ids carry real rates and their
# spend lands in every report total. Verified 2026-08-31 against the pricing
# table published at ollama.com.
#
# Ollama publishes no cache-WRITE rate, so both write buckets are 0 here
# rather than derived from the input rate: an invented multiplier would be a
# guess printed as a number. "Cached input" maps to cache_read.
#
# Each model appears twice: the published name, and the `<name>:cloud` form
# Ollama's runtime actually records (and that Pi writes to its transcripts).
# Both are needed because lookup requires a '-' boundary, so the key
# "glm-5.3" does NOT match the id "glm-5.3:cloud" — without the twin, real
# cloud spend silently reports $0.
#
# CAVEAT — gpt-oss:120b, gpt-oss:20b, and qwen3.5:397b are billed cloud
# models whose ids are IDENTICAL when the same model is pulled and run
# locally, where it is free. tycho cannot tell the two apart and will price
# them as cloud. If you run any of them on your own hardware, zero them out
# in ~/.config/tycho/pricing.toml:
#
#     [models."gpt-oss:120b"]
#     input = 0.0
#     output = 0.0
#     cache_write_5m = 0.0
#     cache_write_1h = 0.0
#     cache_read = 0.0
#
# Locally-run models with a quantization or size tag and no entry here
# (qwen3.8:27b, gemma4:12b, ...) stay free automatically: the local rule
# applies to ':' ids with no pricing entry.

