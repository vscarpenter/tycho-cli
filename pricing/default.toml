# tycho default pricing — USD per million tokens.
#
# Source: Anthropic model pricing reference (cached 2026-06-24), verified
# 2026-07-04 against https://platform.claude.com/docs/en/pricing.
# Cache rates derive from Anthropic's published multipliers on the input
# rate: 5-minute cache write = 1.25x, 1-hour cache write = 2x, cache
# read = 0.1x.
#
# claude-sonnet-5 uses the introductory rate ($2/$10) billed through
# 2026-08-31; the standard rate is $3 input / $15 output. Override any
# model at ~/.config/tycho/pricing.toml or with --pricing <PATH>.
#
# Model lookup is longest-prefix: "claude-opus-4-8-20270101" matches
# "claude-opus-4-8"; a hypothetical "claude-opus-4" entry would only catch
# ids no longer entry matches.

[models."claude-fable-5"]
input = 10.0
output = 50.0
cache_write_5m = 12.5
cache_write_1h = 20.0
cache_read = 1.0

[models."claude-opus-4-8"]
input = 5.0
output = 25.0
cache_write_5m = 6.25
cache_write_1h = 10.0
cache_read = 0.5

[models."claude-opus-4-7"]
input = 5.0
output = 25.0
cache_write_5m = 6.25
cache_write_1h = 10.0
cache_read = 0.5

[models."claude-opus-4-6"]
input = 5.0
